name: job-hunt-collector

on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 AM IST daily (01:30 UTC)
  workflow_dispatch:         # Manual trigger from Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jobspy gspread google-auth pandas openpyxl requests

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_FEED_SHEET_ID: ${{ secrets.RAW_FEED_SHEET_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          PROXIES: ${{ secrets.PROXIES }}
        run: python collector/collect_jobs.py

      - name: Send email notification (only if new jobs found)
        if: ${{ hashFiles('email_body.html') != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🎯 Job Hunt — new roles found today"
          html_body: file://email_body.html
          to: proanand94@gmail.com
          from: "Job Hunt Bot <${{ secrets.GMAIL_USERNAME }}>"
          priority: normal

      - name: Upload CSV fallback (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-raw-feed-csv
          path: job_raw_feed.csv
          if-no-files-found: ignore
