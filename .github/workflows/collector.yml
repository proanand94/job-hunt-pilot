#!/usr/bin/env python3
"""
backfill_seen_urls.py
---------------------
One-time script: reads all job URLs from every dated tab in your Job_Raw_Feed
workbook and adds them to the 'seen_urls' tab so future runs won't repeat them.

Run once from your laptop:
  pip install gspread google-auth
  python backfill_seen_urls.py

Requires: GOOGLE_SERVICE_ACCOUNT_JSON env var (the full JSON string),
          or place the JSON file path in SERVICE_ACCOUNT_FILE below.
"""

import os, json
from datetime import date

# ── Config ───────────────────────────────────────────────────────────────────
SHEET_ID = os.getenv("RAW_FEED_SHEET_ID", "")   # set this env var, or paste ID below
# SHEET_ID = "YOUR_SHEET_ID_HERE"

SERVICE_ACCOUNT_FILE = ""   # path to .json key file, or leave blank to use env var
# SERVICE_ACCOUNT_FILE = "/path/to/service_account.json"

# ── Auth ─────────────────────────────────────────────────────────────────────
import gspread
from google.oauth2.service_account import Credentials

SCOPES = ["https://www.googleapis.com/auth/spreadsheets"]

def auth():
    if SERVICE_ACCOUNT_FILE:
        creds = Credentials.from_service_account_file(SERVICE_ACCOUNT_FILE, scopes=SCOPES)
    else:
        raw = os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON", "")
        if not raw:
            raise SystemExit("Set GOOGLE_SERVICE_ACCOUNT_JSON or SERVICE_ACCOUNT_FILE")
        info = json.loads(raw)
        creds = Credentials.from_service_account_info(info, scopes=SCOPES)
    return gspread.authorize(creds)

# ── Main ─────────────────────────────────────────────────────────────────────
def main():
    gc = auth()
    sh = gc.open_by_key(SHEET_ID)

    # Get or create seen_urls tab
    try:
        seen_ws = sh.worksheet("seen_urls")
        existing = set(v.strip() for v in seen_ws.col_values(1) if v.strip() and v != "job_url")
        print(f"[info] seen_urls tab exists with {len(existing)} URLs")
    except gspread.WorksheetNotFound:
        seen_ws = sh.add_worksheet(title="seen_urls", rows=5000, cols=2)
        seen_ws.update("A1:B1", [["job_url", "date_seen"]])
        existing = set()
        print("[info] Created seen_urls tab")

    # Collect URLs from all dated tabs (e.g. "2026-06-13") and Sheet1/Job_Raw_Feed
    all_urls = []
    today_str = str(date.today())

    for ws in sh.worksheets():
        name = ws.title
        if name == "seen_urls":
            continue
        print(f"[scan] Reading tab: {name}")
        try:
            records = ws.get_all_records()
            for row in records:
                url = str(row.get("job_url", "")).strip()
                if url and url not in existing:
                    all_urls.append([url, today_str])
                    existing.add(url)
        except Exception as e:
            print(f"  [warn] Could not read {name}: {e}")

    if not all_urls:
        print("[done] No new URLs to backfill — seen_urls is already complete.")
        return

    # Append to seen_urls
    seen_ws.append_rows(all_urls, value_input_option="RAW")
    print(f"[done] Backfilled {len(all_urls)} URLs into seen_urls tab.")

if __name__ == "__main__":
    main()
