name: job-hunt-collector

# Runs the JobSpy collector daily and writes fresh jobs to the Google Sheet.
# Free on GitHub-hosted runners for public repos (and within the monthly
# minutes allowance for private repos).

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST daily
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy gspread google-auth pandas

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_FEED_SHEET_ID: ${{ secrets.RAW_FEED_SHEET_ID }}
          PROXIES: ${{ secrets.PROXIES }}
        run: python collector/collect_jobs.py

      - name: Upload CSV fallback (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-raw-feed-csv
          path: job_raw_feed.csv
          if-no-files-found: ignore
